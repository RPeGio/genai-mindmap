# genai-mindmap 的 nginx 站点配置（Alibaba Cloud Linux 3 / nginx 1.20+）
#
# 装法：install.sh 会把它复制到 /etc/nginx/conf.d/genai-mindmap.conf，
# 并把下面两个占位符换成实际值：
#   __DOMAIN__       例如 mindmap.example.com
#   __WEB_ROOT__     前端 dist 目录，默认 /opt/genai-mindmap/frontend/dist
#
# 为什么前端与 /api 走同一个 server：同源之后 CORS 整个话题消失
# （后端 app/main.py 里的 allow_origins 只对 http://localhost:5173 生效，
# 那只是本地开发用；线上同源根本不会发预检）。

server {
    listen 80;
    # IPv6 那一行由 install.sh 决定：AL3 上 IPv6 可能被整体关掉，此时
    # `listen [::]:80` 会让 nginx 起不来，而 `nginx -t` 查不出来（它只做语法检查，
    # 不真的 bind）。占位符在脚本里按 /proc/sys/net/ipv6/conf/all/disable_ipv6 填。
    __LISTEN6__
    server_name __DOMAIN__;
    # 已经签过证书时，80 只负责跳 https；没证书时留空，正常提供页面。
    __REDIRECT__

    root __WEB_ROOT__;
    index index.html;

    # 上传上限：文档 10MB、图片 10MB、音频 20MB，再留一点余量。
    # 默认的 1MB 会让 10MB 的 PDF 在 nginx 层就 413，后端连请求都收不到。
    client_max_body_size 24m;
    client_body_timeout 300s;

    # 公开的健康检查（Basic Auth 之外），只返回 {"status":"ok","version":"..."}
    location = /api/health {
        auth_basic off;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        access_log off;
    }

    # 唯一的后端入口
    location /api/ {
        auth_basic "genai-mindmap";
        auth_basic_user_file /etc/nginx/.htpasswd-mindmap;

        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # 流式生成（SSE）必须关掉缓冲，否则节点要等生成完才一次性冒出来。
        # 后端也发了 X-Accel-Buffering: no，这里是第二道保险。
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;

        # 生成预算最长 600 秒（RunBudget.max_seconds），读超时要比它大；
        # 否则长材料会以 "504 Gateway Time-out" 收场，而后端其实还在跑。
        proxy_connect_timeout 10s;
        proxy_send_timeout 900s;
        proxy_read_timeout 900s;
    }

    # 带哈希的静态资源可以长缓存
    location /assets/ {
        auth_basic "genai-mindmap";
        auth_basic_user_file /etc/nginx/.htpasswd-mindmap;
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # 单页应用：index.html 不缓存，其余路径回落到它
    location / {
        auth_basic "genai-mindmap";
        auth_basic_user_file /etc/nginx/.htpasswd-mindmap;
        add_header Cache-Control "no-store";
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # certbot 会用这个目录做 HTTP-01 校验，不要删
    location /.well-known/acme-challenge/ {
        auth_basic off;
        root /var/www/html;
    }
}
