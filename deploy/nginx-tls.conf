# genai-mindmap 的 HTTPS server 块（可选，由 install.sh 在检测到证书后追加）。
#
# 为什么不直接让 `certbot --nginx` 改配置：它会把 TLS 写进
# /etc/nginx/conf.d/genai-mindmap.conf，而 install.sh 每次都会用模板覆盖这个文件，
# 于是"签完证书、下次跑一遍安装脚本，HTTPS 就没了"。现在证书与配置分开：
#   certbot certonly --webroot 只负责签发/续期
#   本文件负责把证书用起来
# 这样重跑安装脚本不会丢 TLS。
#
# 占位符：__DOMAIN__、__WEB_ROOT__、__CERT_DIR__（默认 /etc/letsencrypt/live/<域名>）

server {
    listen 443 ssl;
    __LISTEN6__
    server_name __DOMAIN__;

    ssl_certificate     __CERT_DIR__/fullchain.pem;
    ssl_certificate_key __CERT_DIR__/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    root __WEB_ROOT__;
    index index.html;

    client_max_body_size 24m;
    client_body_timeout 300s;

    location = /api/health {
        auth_basic off;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        access_log off;
    }

    location /api/ {
        auth_basic "genai-mindmap";
        auth_basic_user_file /etc/nginx/.htpasswd-mindmap;

        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # 这里必须是 https：后端用 X-Forwarded-Proto 判断，写死 http 会让
        # 未来加 Secure Cookie / 绝对地址时错一路。
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";

        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;

        proxy_connect_timeout 10s;
        proxy_send_timeout 900s;
        proxy_read_timeout 900s;
    }

    location /assets/ {
        auth_basic "genai-mindmap";
        auth_basic_user_file /etc/nginx/.htpasswd-mindmap;
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        auth_basic "genai-mindmap";
        auth_basic_user_file /etc/nginx/.htpasswd-mindmap;
        add_header Cache-Control "no-store";
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
