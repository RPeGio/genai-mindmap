# genai-mindmap 容器版 nginx 站点配置
#
# 与 deploy/nginx.conf（线上 systemd 部署用的那份）保持**同一套语义**，差别只有
# 三处，都是"跑在容器里"带来的：
#
#   1. upstream 从 127.0.0.1:8000 换成 compose 的 service 名 `backend:8000`；
#   2. 去掉 Basic Auth（线上那份靠 /etc/nginx/.htpasswd-mindmap，容器里没有
#      这个文件，而且单机自用默认不需要；要加见 docs/DOCKER.md）；
#   3. 去掉 __DOMAIN__ / __WEB_ROOT__ / __LISTEN6__ 这些由 install.sh 填的占位符，
#      也去掉 TLS 与 acme-challenge 那一套（证书交给宿主机的 nginx/caddy）。
#
# 下面每一条**看起来啰嗦**的注释对应的都是线上踩过的一次问题，删之前先读一遍。

# Docker 内嵌 DNS。用它 + $backend 变量，是为了让 nginx **启动时不解析**
# upstream：否则 frontend 比 backend 先起来时会直接以
# "host not found in upstream" 退出；后端容器重建换了 IP 之后，nginx 也会
# 一直拿着旧 IP 返 502 直到重启。
# 注意 `set` 只能出现在 server / location / if 里，所以它写在 server 块内；
# `resolver` 三个上下文都允许，留在外层。
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;
    server_name _;

    # 带变量时 nginx 在**每个请求**上重新查一次 DNS（上面 valid=10s 限制频率），
    # 这也是 `/api/` 那几处 proxy_pass 不写死 IP 的前提。
    set $backend "http://backend:8000";

    root /usr/share/nginx/html;
    index index.html;

    # 上传上限：文档 10MB、图片 10MB、音频 20MB，再留一点余量。
    # 默认的 1MB 会让 10MB 的 PDF 在 nginx 层就 413，后端连请求都收不到。
    client_max_body_size 24m;
    client_body_timeout 300s;

    # 公开的健康检查，只返回 {"status":"ok","version":"..."}。
    # 注意这里**用自己的 /api/health 探针**：容器 HEALTHCHECK 打的就是它，
    # 而它同样要过反代，顺带证明"nginx → 后端"这条链路是通的。
    location = /api/health {
        proxy_pass $backend$request_uri;
        proxy_set_header Host $host;
        access_log off;
    }

    # 模型设置面板的三个接口**单独一段，且必须在 Basic Auth 后面**。
    #
    # 为什么只有这一段要鉴权：面板能改 `base_url`，而"改地址 + 点一次测试连接"就是
    # 一条把**已存的密钥**送到任意地址的路（请求头里是 `Authorization: Bearer <key>`）。
    # 攻击者不需要知道密钥、也不需要读到响应。其余 `/api/` 接口没有这个性质，所以
    # 保持匿名可达，页面才能正常加载。
    #
    # **没有密码文件时这里是 fail closed**：nginx 找不到 `auth_basic_user_file` 会对
    # 这一段一律回 500，而不是回退成匿名可访问。这是刻意的——安全兜底不该有"配置漏了
    # 就悄悄打开"这种形态。要在容器里用设置面板，先在宿主机创建这个文件（见
    # docs/DOCKER.md 第 11 节），docker-compose.yml 已把它只读挂到该路径。
    # 只用本机、不打算暴露的部署可以删掉这一段，那时 `/api/` 那段会接手
    # （也就回到了"面板匿名可达"的状态，代码层还有 `probe._refuse()` 挡内网）。
    location /api/settings/ {
        auth_basic "genai-mindmap";
        auth_basic_user_file /etc/nginx/.htpasswd-mindmap;

        proxy_pass $backend$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        # 这几个请求很小（配置读写、一次 ping），没有任何流式内容，
        # 所以不需要那三行 SSE 的缓冲开关。
    }

    # 唯一的后端入口。同源是刻意的：后端 CORSMiddleware 只放
    # http://localhost:5173 与 http://127.0.0.1:5173（backend/app/main.py:35），
    # 那是本地开发用的；线上同源之后 CORS 整个话题消失，不会发预检。
    location /api/ {
        proxy_pass $backend$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 空 Connection 让 nginx 与上游连保持长连接；不设的话每个 SSE 请求
        # 都新建连接，长生成期间会攒出一堆 TIME_WAIT。
        proxy_set_header Connection "";

        # ------------------------------------------------------------------
        # 流式生成（SSE）必须关掉缓冲，否则节点要等生成完才一次性冒出来。
        # 这三行是从 deploy/nginx.conf 第 53-55 行原样搬过来的，**不能删**：
        # 后端虽然也发了 X-Accel-Buffering: no（app/agent/router.py:51-58），
        # 但那是应用层的一道保险，nginx 层的该关还得关。两层都留着，
        # 少任何一层都会在某条路径上退回"攒够一批才发"。
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;

        # 生成预算最长 600 秒（agent/contracts.py:206 的 RunBudget.max_seconds
        # 默认值 600.0，上界 3600），
        # 读超时必须比它大；否则长材料会以 "504 Gateway Time-out" 收场，
        # 而后端其实还在跑，用户看到的是"失败"，实际是"放弃等待"。
        proxy_connect_timeout 10s;
        proxy_send_timeout 900s;
        proxy_read_timeout 900s;
    }

    # 带哈希的静态资源可以长缓存
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # 单页应用：index.html 不缓存，其余路径回落到它
    location / {
        add_header Cache-Control "no-store";
        try_files $uri $uri/ /index.html;
    }

    # 注意 gzip_types 里**没有** text/event-stream：SSE 不会被压缩，
    # 所以 gzip 不会破坏上面那三行的效果。要是把 * 加进 gzip_types，
    # 事件流会被 zlib 的缓冲截住。
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
